[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bim-preflight"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ifcopenshell==0.8.5",
    "streamlit==1.62.0",
    "plotly==7.0.0",
    "jsonschema==4.26.0",
    "openai==3.7.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.16.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["bim_preflight*"]

[tool.setuptools.package-data]
"bim_preflight.prompt_assets" = ["*.md", "*.json"]

[tool.ruff]
line-length = 100
